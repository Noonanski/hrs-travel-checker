<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HRS Rail Travel Checker</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:640px;margin:auto;padding:28px 16px}.brand{text-align:center}.brand h1{font-size:30px;margin:0}.brand p{font-size:20px;color:#6b7280;font-weight:700;margin:8px 0 28px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}label{font-weight:800;display:block;margin:14px 0 8px}.locked,input{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:14px;padding:18px;font-size:20px;background:#fff}.locked{font-weight:800;background:#f9fafb}input{text-transform:uppercase}button{width:100%;margin-top:18px;padding:18px;border:0;border-radius:14px;background:#111827;color:white;font-size:18px;font-weight:900}.error{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#fff7ed;color:#9a3412}.result{display:none;margin-top:18px;padding:20px;border-radius:16px;text-align:center;border:2px solid}.green{background:#dcfce7;color:#166534;border-color:#86efac}.red{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.result h2{margin:0;font-size:24px}.big{font-size:30px;font-weight:900;margin-top:8px}.small{margin-top:8px;font-size:14px}.note,.meta{color:#6b7280;font-size:13px;line-height:1.5;margin-top:18px}.meta{text-align:center;border-top:1px solid #e5e7eb;padding-top:16px}</style></head><body><main class="wrap"><div class="brand"><h1>HRS RAIL</h1><p>Travel Allowance Checker</p></div><section class="card"><label>Starting location</label><div class="locked">HRS Rail Yard — TN29 9JH</div><label for="postcode">Site postcode</label><input id="postcode" placeholder="e.g. TN26 1HS" maxlength="10"><button id="btn">CHECK TRAVEL</button><div id="error" class="error"></div><div id="result" class="result"><h2 id="status"></h2><div id="big" class="big"></div><div id="detail" class="small"></div></div><p class="note">Fixed TravelTime 120-minute zone from TN29 9JH using the Off-peak traffic model. Sites inside the zone = standard travel. Sites outside = additional payment applies.</p><div class="meta"><strong>Build 6</strong><br>TravelTime • 120 min • Off-peak • 11 Sep 2026</div></section></main><script>
const PARTS=['zone/part-01.txt','zone/part-02a.txt','zone/part-02b.txt','zone/part-02c.txt','zone/part-03.txt','zone/part-04a.txt','zone/part-04b.txt','zone/part-04c.txt'];let zonePromise;const q=id=>document.getElementById(id);function clean(v){return v.trim().toUpperCase().replace(/\s+/g,'')}async function pc(v){const r=await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(clean(v)),{cache:'no-store'});if(!r.ok)throw Error('Postcode not found.');const j=await r.json();if(!j.result)throw Error('Postcode not found.');return{lat:j.result.latitude,lon:j.result.longitude,postcode:j.result.postcode}}
function b64(s){s=s.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}function join(chunks){const n=chunks.reduce((a,c)=>a+c.length,0),out=new Uint8Array(n);let o=0;for(const c of chunks){out.set(c,o);o+=c.length}return out}function decodePolyline(s,p=5){let i=0,lat=0,lon=0,out=[],f=10**p;while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lon+=(r&1)?~(r>>1):(r>>1);out.push([lon/f,lat/f])}return out}
async function loadZone(){if(zonePromise)return zonePromise;zonePromise=(async()=>{const chunks=[];for(const p of PARTS){const r=await fetch(p+'?b=6',{cache:'no-store'});if(!r.ok)throw Error('Could not load travel zone.');chunks.push(b64(await r.text()))}const bytes=join(chunks);if(!('DecompressionStream'in window))throw Error('Please update Safari/iOS and try again.');let text;try{const ds=new DecompressionStream('gzip');text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}catch(e){throw Error('Travel zone file could not be opened.')}let data;try{data=JSON.parse(text)}catch(e){throw Error('Travel zone data is invalid.')}return data.polygons.map(poly=>poly.map(r=>decodePolyline(r,data.precision||5)))})();return zonePromise}
function onSeg(p,a,b){const[x,y]=p,[x1,y1]=a,[x2,y2]=b,e=1e-9,c=(x-x1)*(y2-y1)-(y-y1)*(x2-x1);return Math.abs(c)<=e&&x>=Math.min(x1,x2)-e&&x<=Math.max(x1,x2)+e&&y>=Math.min(y1,y2)-e&&y<=Math.max(y1,y2)+e}function inRing(p,r){let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[j],b=r[i];if(onSeg(p,a,b))return true;const hit=((b[1]>p[1])!==(a[1]>p[1]))&&(p[0]<(a[0]-b[0])*(p[1]-b[1])/(a[1]-b[1])+b[0]);if(hit)ins=!ins}return ins}function inPoly(p,rings){if(!rings.length||!inRing(p,rings[0]))return false;for(let i=1;i<rings.length;i++)if(inRing(p,rings[i]))return false;return true}function inside(p,polys){return polys.some(poly=>inPoly(p,poly))}
async function check(){q('error').style.display='none';q('result').style.display='none';if(!q('postcode').value.trim()){q('error').textContent='Enter the site postcode.';q('error').style.display='block';return}q('btn').disabled=true;q('btn').textContent='CHECKING…';try{const [z,d]=await Promise.all([loadZone(),pc(q('postcode').value)]);const ok=inside([d.lon,d.lat],z);q('result').className='result '+(ok?'green':'red');q('status').textContent=ok?'✓ STANDARD TRAVEL':'✕ ADDITIONAL PAYMENT APPLIES';q('big').textContent=ok?'WITHIN 2 HOURS':'OVER 2 HOURS';q('detail').textContent=d.postcode+' • '+(ok?'Inside':'Outside')+' the HRS Rail off-peak reference zone';q('result').style.display='block'}catch(e){q('error').textContent=e.message||String(e);q('error').style.display='block'}finally{q('btn').disabled=false;q('btn').textContent='CHECK TRAVEL'}}q('btn').onclick=check;q('postcode').addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
